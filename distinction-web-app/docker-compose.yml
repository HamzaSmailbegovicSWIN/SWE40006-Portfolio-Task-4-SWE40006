services:
  web:
    image: hamzaswin/distinction-web-app:1.0
    container_name: distinction-web
    env_file: .env
    expose:
      - "8000"
    networks:
      - appnet
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: distinction-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: